[project]
name = "to-mnn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mnn>=3.6.1",
    "numpy>=2.5.3",
    "transformers>=5.17.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
export = [
    "accelerate>=1.15.0",
    "diffusers>=0.40.0",
    "onnx>=1.23.0",
    "onnxruntime>=1.30.0",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
]
runtime = [
    "ftfy>=6.3.1",
    "pillow>=12.3.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # import 정렬
    "B",   # 흔한 버그 패턴
    "C4",  # comprehension 개선
    "UP",  # Python 문법 현대화
    "PIE", # 불필요한 코드 검사
    "T10", # 디버거 잔여 코드 검사
]
# 줄 길이는 formatter에 맡긴다.
ignore = ["E501"]
